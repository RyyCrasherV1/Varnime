<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Episode</title>

  <!-- Google Login -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Socket -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

  <style>
    body {
      background: #0b0b0b;
      color: #fff;
      font-family: sans-serif;
      margin: 0;
      padding: 12px;
    }
    video {
      max-width: 100%;
      border-radius: 8px;
    }
    .comment {
      background: #111;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 6px;
    }
    .badge {
      font-size: 12px;
      color: #ff5fa2;
      margin-left: 6px;
    }
    button {
      margin-top: 6px;
    }
  </style>
</head>

<body>

  <!-- VIDEO -->
  <video src="video.mp4" controls></video>

  <hr>

  <!-- LOGIN -->
  <div id="login"></div>

  <!-- KOMENTAR -->
  <section id="comment-section">
    <h3>Komentar</h3>

    <div id="comment-list"></div>

    <form id="comment-form">
      <input id="message" placeholder="Tulis komentar..." required />
      <button type="submit">Kirim</button>
    </form>
  </section>

  <!-- JS -->
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/comments.js"></script>

</body>
</html>
